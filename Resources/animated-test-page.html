<!doctype html>
<meta charset="utf-8">
<title>SpaceMemory animation test</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 700 72px -apple-system, sans-serif; color: #fff; }
</style>
<div id="clock"></div>
<script>
  const clock = document.getElementById("clock");
  function tick(now) {
    document.body.style.background = `hsl(${(now / 20) % 360} 70% 40%)`;
    clock.textContent = (now / 1000).toFixed(2);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
